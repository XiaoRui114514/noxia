name: Deliver Noxia 0.3 IPA
on:
  push:
    branches: [build/ipa-0.3.0]
    paths: ['.github/workflows/ipa-delivery.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: XiaoRui114514/noxia
    steps:
      - name: Download and verify the completed device build
        run: |
          gh run download 42384144475 --name Noxia-iPad-IPA-to-sign --dir delivery
          echo 'a127a2212ba86dbe5a6820bc60f68ea98c2f2ffe4ef0e7529d6ec1ed2f754840  delivery/Noxia-unsigned.ipa' | sha256sum --check
          python3 - <<'PY'
          import zipfile,plistlib
          with zipfile.ZipFile('delivery/Noxia-unsigned.ipa') as z:
              assert z.testzip() is None
              p=plistlib.loads(z.read('Payload/Noxia.app/Info.plist'))
              assert p['CFBundleShortVersionString']=='0.3.0' and p['CFBundleVersion']=='3'
              assert p['CFBundleSupportedPlatforms']==['iPhoneOS'] and 2 in p['UIDeviceFamily']
          PY
          mv delivery/Noxia-unsigned.ipa delivery/Noxia-0.3.0.ipa
          cd delivery
          sha256sum Noxia-0.3.0.ipa > Noxia-0.3.0.ipa.sha256
      - name: Publish standalone IPA for owner signing
        run: |
          gh release create v0.3.0-build3 delivery/Noxia-0.3.0.ipa delivery/Noxia-0.3.0.ipa.sha256 delivery/BUILD-INFO.json --target 83e36509ba08711b3050b70809ef0401e3bdef91 --prerelease --title 'Noxia 0.3.0 · IPA' --notes 'ARM64 iPhoneOS Release, build 3, iPadOS 16.4+. Unsigned: sign with your own signing method before installation. Built from 83e3650; original build run 42384144475. No production account/database changes.'
